<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0055ea" />

    <!-- SEO & Metadata -->
    <title>NSaiPetroSoft - Fuel Station ERP & Forecourt Automation</title>
    <meta
      name="description"
      content="NSaiPetroSoft is an enterprise petroleum retail ERP for automated fuel dispensing, shift totalizer reconciliation, credit vehicle billing, underground tank dips, and financial accounts."
    />
    <meta
      name="keywords"
      content="petrol pump software, fuel station ERP, petroleum retail management, forecourt automation, nozzle meter readings, tank dip register, credit slip billing"
    />
    <meta name="author" content="NSaiPetroSoft" />

    <!-- OpenGraph Social Link Previews -->
    <meta property="og:title" content="NSaiPetroSoft - Fuel Station ERP & Forecourt Automation" />
    <meta
      property="og:description"
      content="Enterprise petroleum retail management: automated shift settlements, dispenser meter rollover handling, credit customer billing, and Cloudflare R2 disaster recovery."
    />
    <meta property="og:url" content="https://nsaipetrosoft.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NSaiPetroSoft - Fuel Station ERP & Forecourt Automation" />
    <meta
      name="twitter:description"
      content="Enterprise petroleum retail ERP for modern petrol pump forecourt operations and accounts."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Progressive Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Initial App Skeleton Styles (Replaced automatically upon React Mount) */
      .app-shell-skeleton {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(180deg, #0a246a 0%, #3a6ea5 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .app-shell-card {
        background: #ece9d8;
        border: 2px solid #ffffff;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 1px 1px #ffffff, inset -1px -1px #808080;
        border-radius: 4px;
        width: 100%;
        max-width: 440px;
        padding: 24px;
        text-align: center;
        color: #000000;
      }
      .app-shell-header {
        font-size: 20px;
        font-weight: 700;
        color: #0a246a;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }
      .app-shell-sub {
        font-size: 13px;
        color: #444444;
        margin-bottom: 24px;
      }
      .app-shell-spinner {
        display: inline-block;
        width: 42px;
        height: 42px;
        border: 4px solid #d4d0c8;
        border-radius: 50%;
        border-top-color: #0055ea;
        animation: spin 0.8s ease-in-out infinite;
        margin-bottom: 16px;
      }
      .app-shell-status {
        font-size: 13px;
        font-weight: 600;
        color: #0a246a;
      }
      .app-shell-badge {
        display: inline-block;
        margin-top: 14px;
        padding: 4px 10px;
        font-size: 11px;
        font-family: monospace;
        background: #ffffff;
        border: 1px solid #7f9db9;
        border-radius: 2px;
        color: #2e6b12;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      noscript {
        display: block;
        margin: 20px auto;
        max-width: 500px;
      }
    </style>
  </head>
  <body>
    <!-- Fallback message if JavaScript is disabled -->
    <noscript>
      <div style="background:#fff3cd; color:#856404; padding:20px; border:2px solid #ffeeba; border-radius:6px; font-family:sans-serif; text-align:center;">
        <h2 style="margin:0 0 10px 0;">JavaScript Required</h2>
        <p style="margin:0 0 10px 0;">
          NSaiPetroSoft Petroleum ERP requires JavaScript to execute forecourt data sync, shift calculations, and offline storage.
        </p>
        <p style="margin:0; font-size:13px;">Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>

    <!-- Root container with branded instant loading skeleton -->
    <div id="root">
      <div class="app-shell-skeleton">
        <div class="app-shell-card">
          <div style="font-size: 36px; margin-bottom: 8px;">⛽</div>
          <div class="app-shell-header">NSaiPetroSoft</div>
          <div class="app-shell-sub">Petroleum Retail ERP & Forecourt Automation</div>
          <div>
            <div class="app-shell-spinner"></div>
          </div>
          <div class="app-shell-status" id="app-shell-status-text">Initializing Forecourt POS Environment...</div>
          <div class="app-shell-badge">ACID Transactions • Hardware Meter Sync • Cloud R2</div>
          <div id="app-shell-deadlock-guard" style="display: none; margin-top: 14px;">
            <button
              type="button"
              onclick="try { localStorage.removeItem('nsaipetrosoft_master_state_v2'); sessionStorage.clear(); window.location.reload(); } catch(e) {}"
              style="background:#27ae60; color:#fff; border:1px solid #1e824c; border-radius:4px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer;"
            >
              ⚡ Launch in Safe Standby Mode
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Watchdog timer: If app hasn't mounted in 2800ms, reveal safe launch button
      setTimeout(function() {
        var guard = document.getElementById('app-shell-deadlock-guard');
        var status = document.getElementById('app-shell-status-text');
        if (guard && document.querySelector('.app-shell-skeleton')) {
          guard.style.display = 'block';
          if (status) status.innerText = 'Connecting to Forecourt Storage...';
        }
      }, 2800);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
